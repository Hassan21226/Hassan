name: Publish menu to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-menu-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: latest-site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EXTERNAL_CLOUDFLARE: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required secrets
        run: |
          node -e 'for(const k of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","ADMIN_PASSWORD"])if(!process.env[k])throw Error("Missing GitHub Actions secret: "+k)'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare database, storage and copy existing menu
        run: node deployment/cloudflare.mjs prepare
      - name: Build full application
        run: pnpm exec vinext build
      - name: Configure admin password and publish
        run: node deployment/cloudflare.mjs publish
