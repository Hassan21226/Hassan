<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المنيو | لذة الأجداد</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:900px;margin:45px auto;padding:0 20px 70px}.admin-panel{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,38px);box-shadow:0 10px 30px #1c392a08}.admin-panel h1{font-family:'Amiri';font-size:42px;margin:0}.hint{color:#7d8277;line-height:1.8}.edit-card{border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}.edit-card h2{margin-top:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:14px;color:#74796e}.field input,.field select{border:1px solid #dddcd2;border-radius:10px;padding:12px;font:15px 'Tajawal';min-width:0}.save{background:var(--green);color:white;border:0;border-radius:12px;padding:14px 22px;font:600 15px 'Tajawal';cursor:pointer;margin-top:18px}.preview{margin-top:22px;padding:20px;background:#f4f4ed;border-radius:14px}.status{color:#487c50;margin-top:12px}.admin-nav{display:flex;gap:12px;align-items:center}.admin-nav a{color:var(--green)}@media(max-width:600px){.fields{grid-template-columns:1fr}.admin-panel h1{font-size:35px}}
</style></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>لذة الأجداد</span></a><nav class="admin-nav"><a href="index.html">عرض المنيو</a></nav></header>
<main class="admin-wrap"><div class="admin-panel"><p class="eyebrow gold">لوحة الإدارة</p><h1>منيوك، على ذوقك</h1><p class="hint">عدّل اسم الطبق وأحجامه وأسعاره هنا. تُحفظ التغييرات في هذا المتصفح فقط في هذه النسخة التجريبية.</p><div id="editors"></div><button class="save" id="save">حفظ التعديلات</button><p class="status" id="status" aria-live="polite"></p><div class="preview"><strong>معاينة اختيار الحجم</strong><p class="hint">في صفحة المنيو تظهر الأحجام كأزرار مستطيلة، ويتغيّر السعر عند اختيار أي زر.</p><a href="index.html">افتح صفحة المنيو ←</a></div></div></main>
<script>
const defaults=[{id:1,name:"عريكة",description:"عريكة جنوبية",category:"أكل شعبي",sizes:[{name:"وسط",price:120},{name:"كبير",price:150}],details:"نكهة جنوبية أصيلة، تُحضّر بعناية."},{id:2,name:"طبق شعبي",description:"من أطباق تراثنا",category:"أكل شعبي",sizes:[{name:"وسط",price:null},{name:"كبير",price:null}],details:"طبق محضّر بكل حب."}];
let products;try{products=JSON.parse(localStorage.getItem("lathatProducts"))||defaults}catch{products=defaults}
const editors=document.querySelector("#editors");
function renderEditors(){editors.innerHTML=products.map((p,i)=>`<section class="edit-card" data-i="${i}"><h2>${i+1}. ${p.name}</h2><div class="fields">
<div class="field"><label>اسم الطبق</label><input data-k="name" value="${esc(p.name)}"></div>
<div class="field"><label>الوصف</label><input data-k="description" value="${esc(p.description)}"></div>
<div class="field"><label>التصنيف</label><input data-k="category" value="${esc(p.category)}"></div>
${p.sizes.map((s,j)=>`<div class="field"><label>اسم الحجم ${j+1}</label><input data-size="${j}" data-k="name" value="${esc(s.name)}"></div><div class="field"><label>السعر ${s.name} (ريال)</label><input type="number" min="0" data-size="${j}" data-k="price" value="${s.price??""}" placeholder="أدخل السعر"></div>`).join("")}
<div class="field" style="grid-column:1/-1"><label>تفاصيل الطبق</label><input data-k="details" value="${esc(p.details||"")}"></div></div></section>`).join("")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
renderEditors();
document.querySelector("#save").addEventListener("click",()=>{document.querySelectorAll(".edit-card").forEach(card=>{const p=products[Number(card.dataset.i)];card.querySelectorAll("input").forEach(input=>{if(input.dataset.size!==undefined){const s=p.sizes[Number(input.dataset.size)];s[input.dataset.k]=input.dataset.k==="price"?(input.value===""?null:Number(input.value)):input.value}else p[input.dataset.k]=input.value})});localStorage.setItem("lathatProducts",JSON.stringify(products));document.querySelector("#status").textContent="تم حفظ التعديلات في هذا المتصفح. افتح المنيو لمعاينتها.";renderEditors()});
</script></body></html>
